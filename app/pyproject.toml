[project]
name = "knowledge-extraction"
version = "0.1.0"
description = "LangChain-based knowledge extraction from PDF files and Miro boards to Neo4j"
requires-python = ">=3.14"

dependencies = [
    "langchain>=1.3.2",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.4",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
    "numpy>=2.4.6",
    "pdfplumber>=0.11.9",
    "pillow>=12.2.0",
    "pypdf>=6.12.2",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=0.6.21",
    "pymupdf>=1.27.2.3",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "boto3>=1.43.39",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []
